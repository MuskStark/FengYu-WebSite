openapi: 3.1.0
info:
  title: FengYu-WebSite API
  version: 1.0.0
  summary: Catalog, publishing, review and delivery API for the Infinia / FengYu ecosystem.
  description: |
    Versioned REST API of FengYu-WebSite (design §10).

    * Root path `/api/v1`; breaking changes ship as `/api/v2` — never via headers.
    * JSON is camelCase, timestamps are UTC RFC 3339, identifiers are UUIDv7/ULID.
    * Errors use `application/problem+json` with a stable `code`, `traceId` and
      localizable arguments.
    * Lists use cursor pagination; write endpoints accept `Idempotency-Key`;
      concurrent updates use `ETag/If-Match`.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.txt
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: Catalog
  - name: Listings
  - name: Resolution
  - name: Delivery
  - name: Updates
  - name: Account
  - name: Library
  - name: Membership
  - name: Telemetry
  - name: Publisher
  - name: Review
  - name: Organizations
  - name: Moderation
  - name: Admin
  - name: Compatibility
  - name: Blobs
  - name: Status

paths:
  /catalog:
    get:
      operationId: browseCatalog
      tags: [Catalog]
      summary: Browse the public catalog (anonymous access allowed)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ListingType' } }
        - { name: query, in: query, schema: { type: string, maxLength: 128 }, description: Free-text search over name, summary and tags }
        - { name: category, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: hostVersion, in: query, schema: { type: string }, description: Only listings with a compatible release }
        - { name: os, in: query, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: arch, in: query, schema: { $ref: '#/components/schemas/Arch' } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, recent, downloads, favorites], default: relevance } }
        - { name: featured, in: query, schema: { type: boolean }, description: Editorial featured shelf only }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200':
          description: Catalog page
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }

  /listings/{namespace}/{slug}:
    get:
      operationId: getListing
      tags: [Listings]
      summary: Listing detail with visible releases
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
      responses:
        '200':
          description: Listing detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDetail' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /listings/{namespace}/{slug}/ratings:
    get:
      operationId: listRatings
      tags: [Listings]
      summary: Ratings and average score of a listing (anonymous access allowed)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Ratings page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingsPage' }
    put:
      operationId: upsertRating
      tags: [Moderation]
      summary: Create or update the caller's rating (one per user per listing)
      security:
        - bearerAuth: []
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertRatingRequest' }
      responses:
        '200':
          description: Stored rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }

  /reports:
    post:
      operationId: reportListing
      tags: [Moderation]
      summary: Report a listing for abuse / policy violation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '409': { $ref: '#/components/responses/ProblemConflict' }

  /resolutions:
    post:
      operationId: resolve
      tags: [Resolution]
      summary: Resolve versions and dependency closure for a client environment
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveRequest' }
      responses:
        '200':
          description: Resolution plan (resolvable=false when dependencies are missing)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveResponse' }

  /releases/{releaseId}/install-manifest:
    get:
      operationId: getInstallManifest
      tags: [Delivery]
      summary: FengYu Native install manifest (aggregation plan §7.1) — signed artifact + install mode
      description: |
        Schema-versioned install contract for the host's SkillInstaller /
        McpInstaller. MCP installs always default to disabled with secrets
        kept local; compatibility surfaces are never a separate trust root.
      security:
        - {}
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
        - { name: client, in: query, schema: { type: string, default: fengyu } }
      responses:
        '200':
          description: Install manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemaVersion: { type: integer }
                  coordinate: { type: string }
                  type: { type: string }
                  sourceReleaseId: { type: string }
                  artifact:
                    type: object
                    properties:
                      url: { type: string, format: uri }
                      sha256: { type: string }
                      signature: { type: string }
                      keyId: { type: string }
                      size: { type: integer, format: int64 }
                  dependencies:
                    type: array
                    items:
                      type: object
                      properties:
                        coordinate: { type: string }
                        range: { type: string }
                        optional: { type: boolean }
                  permissions:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }
                  install:
                    type: object
                    properties:
                      mode: { type: string, enum: [SKILL_DIRECTORY, MCP_TEMPLATE, PLUGIN_PACKAGE] }
                      defaultEnabled: { type: boolean }
                      secretsPolicy: { type: string }
                  resolvedAt: { type: string, format: date-time }
        '409': { description: Release not installable }

  /releases/{releaseId}/install-package:
    get:
      operationId: getInstallPackage
      tags: [Delivery]
      summary: Offline install package — Native install manifest + signed artifact + checksums in one ZIP
      description: |
        Web-downloadable package for the host's local install mode: the same
        Native install manifest as /install-manifest (plus a `package` layout
        block and the in-package artifact filename), the artifact bytes under
        `artifact/` and a sha256sum-compatible `checksums.txt`. The host
        verifies the embedded sha256/Ed25519 signature locally, so the file
        installs without a store connection while preserving full provenance.
      security:
        - {}
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
        - { name: client, in: query, schema: { type: string, default: fengyu } }
      responses:
        '200':
          description: ZIP install package (attachment)
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { description: Infinia Level below the listing gate }
        '404': { description: Release, listing or PACKAGE artifact not found }
        '409': { description: Release not installable }

  /compat/fengyu/mcp-catalog:
    get:
      operationId: fengyuMcpCatalog
      tags: [Compatibility]
      summary: Legacy-shape MCP catalog with direct template downloads
      security:
        - {}
      responses:
        '200':
          description: MCP catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    description: { type: string }
                    version: { type: string }
                    author: { type: string }
                    downloadUrl: { type: string, description: Direct HMAC-ticketed template URL }
                    sha256: { type: string }
                    transport: { type: string }
                    official: { type: boolean }

  /compat/fengyu/codex/catalog:
    get:
      operationId: fengyuCodexCatalog
      tags: [Compatibility]
      summary: Codex-consumable skill catalog pointing at native manifests
      security:
        - {}
      responses:
        '200':
          description: Codex catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemaVersion: { type: integer }
                  generator: { type: string }
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        skillId: { type: string }
                        version: { type: string }
                        listing: { type: string }
                        installManifest: { type: string }

  /compat/fengyu/claude-marketplace.json:
    get:
      operationId: claudeEcosystemMarketplace
      tags: [Compatibility]
      summary: CLAUDE-ecosystem marketplace exporting skills and MCP templates as git sources
      description: |
        Each published SKILL/MCP listing is materialized as a small local git
        repository carrying a .claude-plugin/plugin.json (skills paths and an
        mcpServers block). Registering this URL as a CLAUDE-type source in the
        FengYu host installs skills and disabled MCP server definitions through
        the host's existing ecosystem installer; re-cloning picks up updates.
      security:
        - {}
      responses:
        '200':
          description: Claude marketplace document
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        category: { type: string }
                        keywords: { type: array, items: { type: string } }
                        author:
                          type: object
                          properties:
                            name: { type: string }
                        source:
                          type: object
                          properties:
                            source: { type: string, enum: [url] }
                            url: { type: string, description: file:// clone URL }

  /compat/fengyu/skills-catalog:
    get:
      operationId: fengyuSkillsCatalog
      tags: [Compatibility]
      summary: SkillCatalogEntry-compatible skill catalog (fengyu.skills.catalog-url)
      security:
        - {}
      responses:
        '200':
          description: Legacy skill catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    description: { type: string }
                    version: { type: string }
                    author: { type: string }
                    downloadUrl: { type: string }
                    official: { type: boolean }

  /compat/fengyu/fengyu-releases/api/releases/latest:
    get:
      operationId: fengyuPortableReleaseMirror
      tags: [Compatibility]
      summary: GitHub-releases-compatible mirror for the Electron portable updater
      description: Consumed via the host's updateApiBase setting ({base}/fengyu-releases/api/releases/latest).
      security:
        - {}
      parameters:
        - { name: channel, in: query, schema: { type: string } }
      responses:
        '200':
          description: GitHub-compatible release object, or [] when no stable APP release exists
          content:
            application/json:
              schema: {}

  /compat/fengyu/catalog:
    get:
      operationId: fengyuCompatCatalog
      tags: [Compatibility]
      summary: MarketplaceCatalogEntry-compatible plugin catalog for the FengYu host store
      description: |
        Serves the JSON array contract the FengYu host's built-in FENGYU marketplace
        source type fetches, so the host lists, updates and downloads plugins with
        zero code changes. Each entry carries the latest published version and a
        direct HMAC-ticketed downloadUrl for the package artifact.
      security:
        - {}
      responses:
        '200':
          description: Legacy catalog entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FengYuCatalogEntry' }

  /releases/{releaseId}/download-ticket:
    post:
      operationId: createDownloadTicket
      tags: [Delivery]
      summary: Mint a short-lived, purpose-limited CDN download ticket
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
        - { name: artifactId, in: query, schema: { type: string }, description: Select a specific artifact; defaults to the best platform match }
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadTicket' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }

  /releases/{releaseId}/checksums.txt:
    get:
      operationId: releaseChecksums
      tags: [Delivery]
      summary: sha256sum-style checksum manifest of a published release's binary artifacts (design §8.3)
      security:
        - {}
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'One `<sha256>  <filename>` line per INSTALLER / PORTABLE / PACKAGE artifact, sorted by filename'
          content:
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }

  /updates/app:
    get:
      operationId: appUpdateFeed
      tags: [Updates]
      summary: RESERVED — deliberately unimplemented (audit 3.5)
      description: |
        No shipped client consumes this endpoint: the desktop deb updater reads the
        electron-updater generic feed at `/fengyu-updates/deb/latest-linux.yml`, the
        Windows portable updater reads the compat GitHub-releases mirror, and the
        portable-web backend checks GitHub directly. The historic response fields
        never matched any of those contracts, so the endpoint answers 501 until it
        is wired to a real client contract.
      security:
        - {}
      responses:
        '501':
          description: Endpoint reserved; no consumer exists
          content:
            application/problem+json:
              schema: { type: object }

  /auth/register:
    post:
      operationId: register
      tags: [Account]
      summary: Register a store account
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '409': { $ref: '#/components/responses/ProblemConflict' }

  /auth/login:
    post:
      operationId: login
      tags: [Account]
      summary: Direct email + password login; returns an access token and registers a revocable session
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access token with current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }

  /auth/registration-policy:
    get:
      operationId: getRegistrationPolicy
      tags: [Account]
      summary: Public registration policy — the sign-up form shows an invitation field when required
      security:
        - {}
      responses:
        '200':
          description: Whether registration currently requires an invitation code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationPolicy' }

  /invitations:
    post:
      operationId: createInvitation
      tags: [Account]
      summary: Mint one invitation code against the caller's monthly quota
      description: >-
        Requires effective Infinia Level 2+ (FORAGER); Level 2 shares 2 codes
        per calendar month, Level 3 five, Level 4 ten. Platform admins share
        without limit.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Minted code (single-use)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCode' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429':
          description: Monthly invitation quota exhausted (problem+json, code invitation_quota_exceeded)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /invitations/mine:
    get:
      operationId: getMyInvitations
      tags: [Account]
      summary: The caller's monthly quota, usage and issued codes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Share surface with every code the caller issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyInvitations' }


  /me:
    get:
      operationId: getCurrentUser
      tags: [Account]
      summary: Current authenticated principal
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
    put:
      operationId: updateCurrentUser
      tags: [Account]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }

  /me/password:
    put:
      operationId: changePassword
      tags: [Account]
      summary: Change password after re-authenticating with the current one
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePasswordResult' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }

  /me/sessions:
    get:
      operationId: listSessions
      tags: [Account]
      summary: Active sessions and grants
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }

  /me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [Account]
      summary: Revoke a session or grant
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }

  /me/devices:
    get:
      operationId: listDevices
      tags: [Account]
      summary: Registered host devices
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }

  /me/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [Account]
      summary: Revoke a device (refresh tokens issued to it become invalid immediately)
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }

  /me/library:
    get:
      operationId: getLibrary
      tags: [Library]
      summary: Favorites, entitlements and install history
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }

  /me/installed:
    get:
      operationId: listInstalled
      tags: [Library]
      summary: Installed listings derived from install telemetry (hint, not truth — ADR-009)
      responses:
        '200':
          description: Installed items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstalledItem' }

  /me/updates:
    get:
      operationId: listUpdates
      tags: [Library]
      summary: Installed listings with a newer published release
      responses:
        '200':
          description: Updatable items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstalledItem' }

  /me/favorites/{listingId}:
    put:
      operationId: addFavorite
      tags: [Library]
      summary: Favorite a listing
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Favorited }
    delete:
      operationId: removeFavorite
      tags: [Library]
      summary: Remove a favorite
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }

  /membership/plans:
    get:
      operationId: listMembershipPlans
      tags: [Membership]
      summary: Public Infinia Level pricing (会员套餐)
      security: []
      responses:
        '200':
          description: Active plans, display order first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MembershipPlan' }

  /membership/status:
    get:
      operationId: getMembershipStatus
      tags: [Membership]
      summary: The caller's ladder position and payable channels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Base level, effective level and active membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipStatus' }

  /membership/orders:
    post:
      operationId: createMembershipOrder
      tags: [Membership]
      summary: Create a purchase order and a gateway cashier session
      description: >-
        Redirect the buyer's browser to the returned payUrl. Plans must climb
        the ladder (or renew the active tier); the order snapshots the plan's
        terms. The payment window closes after store.pay.order-expire-minutes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMembershipOrderRequest' }
      responses:
        '200':
          description: Created order with the cashier URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipOrder' }

  /membership/orders/{orderNo}:
    get:
      operationId: getMembershipOrder
      tags: [Membership]
      summary: The caller's order status (return-page polling)
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string } }
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order (PENDING orders past their window close lazily)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipOrder' }

  /payments/xunhu/notify:
    get:
      operationId: xunhuNotifyGet
      tags: [Membership]
      summary: XunHuPay payment callback (GET variant) — signature-verified
      security: []
      parameters:
        - in: query
          name: params
          required: true
          schema: { type: string }
          description: All gateway callback fields incl. hash
      responses:
        '200':
          description: Verified and applied — body is the literal text "success"
          content:
            text/plain:
              schema: { type: string, example: success }
        '400':
          description: Verification failed — body is the literal text "fail"
          content:
            text/plain:
              schema: { type: string, example: fail }
    post:
      operationId: xunhuNotifyPost
      tags: [Membership]
      summary: XunHuPay payment callback (form POST) — signature-verified
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Gateway callback fields incl. hash
      responses:
        '200':
          description: Verified and applied — body is the literal text "success"
          content:
            text/plain:
              schema: { type: string, example: success }
        '400':
          description: Verification failed — body is the literal text "fail"
          content:
            text/plain:
              schema: { type: string, example: fail }

  /payments/bmac/notify:
    post:
      operationId: bmacNotify
      tags: [Membership]
      summary: Buy Me a Coffee webhook — HMAC-SHA256 signed (x-signature-sha256)
      description: >-
        Signed JSON body per the BMAC webhook spec; payments are matched back to
        pending orders by supporter email + amount. Acknowledged events answer
        the literal text "success"; only a bad signature answers "fail".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Event envelope with event-specific data fields.
      responses:
        '200':
          description: Verified or acknowledged — body is the literal text "success"
          content:
            text/plain:
              schema: { type: string, example: success }
        '400':
          description: Signature verification failed — body is the literal text "fail"
          content:
            text/plain:
              schema: { type: string, example: fail }

  /install-events:
    post:
      operationId: reportInstallEvents
      tags: [Telemetry]
      summary: Report optional, idempotent install telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/InstallEvent' }
      responses:
        '202': { description: Accepted }

  /publisher/listings:
    get:
      operationId: listPublisherListings
      tags: [Publisher]
      summary: Listings owned by the caller's namespaces
      responses:
        '200':
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogItem' }
    post:
      operationId: createListing
      tags: [Publisher]
      summary: Create a listing in a namespace the caller owns
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListingRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDetail' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }

  /publisher/listings/{listingId}/releases:
    get:
      operationId: listPublisherReleases
      tags: [Publisher]
      summary: All releases of a listing including DRAFTs, newest first
      description: >-
        Lets publisher tooling resume an interrupted draft (upload + submit)
        after a reload. Owner or platform admin only.
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublisherRelease' }
    post:
      operationId: createRelease
      tags: [Publisher]
      summary: Create a draft release
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReleaseRequest' }
      responses:
        '201':
          description: Draft release created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherRelease' }

  /publisher/releases/{releaseId}/uploads:
    post:
      operationId: createUploadSession
      tags: [Publisher]
      summary: Create an upload session; returns a short-lived presigned PUT URL
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, kind]
              properties:
                filename: { type: string, maxLength: 255 }
                kind: { $ref: '#/components/schemas/ArtifactKind' }
                platform: { $ref: '#/components/schemas/Platform' }
                arch: { $ref: '#/components/schemas/Arch' }
                variant: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
                size: { type: integer, format: int64, minimum: 1 }
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }

  /publisher/releases/{releaseId}/submit:
    post:
      operationId: submitRelease
      tags: [Publisher]
      summary: Submit a release for scanning and review
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Accepted for scanning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResult' }

  /publisher/releases/{releaseId}:
    get:
      operationId: getPublisherRelease
      tags: [Publisher]
      summary: Release status including scan findings
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherRelease' }

  /publisher/releases/{releaseId}/yank:
    post:
      operationId: yankOwnRelease
      tags: [Publisher]
      summary: Self-withdraw one of the caller's published releases
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Yanked }
        '403': { $ref: '#/components/responses/ProblemForbidden' }

  /publisher/listings/{listingId}/min-bee-level:
    post:
      operationId: setOwnListingMinBeeLevel
      tags: [Publisher]
      summary: Publisher adjustment of the Infinia Level gate on an owned listing
      description: >-
        0 keeps the listing public (anonymous included); 1..4 restricts view and
        download to signed-in accounts at or above that hive level.
      security:
        - bearerAuth: []
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minBeeLevel]
              properties:
                minBeeLevel: { type: integer, minimum: 0, maximum: 4 }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDetail' }

  /reviews:
    get:
      operationId: listReviews
      tags: [Review]
      summary: Review queue (REVIEWER or PLATFORM_ADMIN)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [IN_REVIEW, APPROVED, REJECTED, CHANGES_REQUESTED] } }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }

  /reviews/{reviewId}/decisions:
    post:
      operationId: decideReview
      tags: [Review]
      summary: Record a review decision; APPROVE publishes and platform-signs the envelope
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT, REQUEST_CHANGES] }
                notes: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }

  /admin/releases/{releaseId}/yank:
    post:
      operationId: yankRelease
      tags: [Review]
      summary: Yank (soft-withdraw) a published release — PLATFORM_ADMIN
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Yanked }

  /admin/releases/{releaseId}/quarantine:
    post:
      operationId: quarantineRelease
      tags: [Review]
      summary: Quarantine a release on a security event — PLATFORM_ADMIN
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Quarantined }

  /admin/app-releases:
    get:
      operationId: listAdminAppReleases
      tags: [Admin]
      summary: The conventional host listing's releases, newest first — PLATFORM_ADMIN
      description: |
        Manual-update bookkeeping for the intranet admin console (the store
        replaces the FY-Proxy distribution center).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Releases (drafts included); empty when nothing was uploaded yet
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminAppRelease' }
    post:
      operationId: startAdminAppUpload
      tags: [Admin]
      summary: Start a manual host-app update upload — PLATFORM_ADMIN
      description: |
        Ensures the conventional APP listing (store.app-coordinate), drafts the
        release and returns the presigned PUT URL for the package bytes (same
        ticketed pipeline as the publisher portal). Version and channel are
        inferred from the package filename when omitted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAppUploadStart' }
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppUploadSession' }
    delete:
      operationId: deleteAdminAppRelease
      tags: [Admin]
      summary: Delete a manually uploaded release — PLATFORM_ADMIN
      description: |
        Hard-removes the release row (any status; removal supersedes a yank).
        The app update feed and the compat mirror stop serving it immediately.
      security:
        - bearerAuth: []
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown release }

  /admin/app-releases/{releaseId}/publish:
    post:
      operationId: publishAdminAppUpload
      tags: [Admin]
      summary: Publish a manually uploaded release immediately — PLATFORM_ADMIN
      description: |
        The platform admin is the review decision: the envelope and every
        artifact are platform-signed like an approval, with a distinct audit
        trail (release.admin-publish).
      security:
        - bearerAuth: []
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Published release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppRelease' }

  /admin/app-releases/{releaseId}/delete:
    post:
      operationId: deleteAdminAppUploadViaPost
      tags: [Admin]
      summary: Delete alias (POST form) — PLATFORM_ADMIN
      deprecated: true
      security:
        - bearerAuth: []
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }

  /admin/listings:
    get:
      operationId: listAllListings
