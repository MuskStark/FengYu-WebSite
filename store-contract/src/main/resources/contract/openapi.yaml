              properties:
                featured: { type: boolean }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListing' }

  /admin/databases:
    get:
      operationId: listRemoteDatabases
      tags: [Admin]
      summary: Registered remote database endpoints — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connections (credentials never returned)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemoteDatabase' }
    post:
      operationId: createRemoteDatabase
      tags: [Admin]
      summary: Register a remote database endpoint — PLATFORM_ADMIN
      description: >-
        Only jdbc:postgresql:// and jdbc:h2: URLs are accepted (the shipped
        drivers); H2 INIT/RUNSCRIPT parameters are rejected. The password is
        AES-GCM sealed at rest and never returned by the API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRemoteDatabaseRequest' }
      responses:
        '201':
          description: Registered connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDatabase' }

  /admin/databases/status:
    get:
      operationId: dataSourceStatus
      tags: [Admin]
      summary: What the running instance is connected to right now — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current data source (URL password-masked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSourceStatus' }

  /admin/databases/{databaseId}:
    put:
      operationId: updateRemoteDatabase
      tags: [Admin]
      summary: Update a registered endpoint — PLATFORM_ADMIN
      description: A blank/absent password keeps the stored credential.
      security:
        - bearerAuth: []
      parameters:
        - { name: databaseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRemoteDatabaseRequest' }
      responses:
        '200':
          description: Updated connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDatabase' }
    delete:
      operationId: deleteRemoteDatabase
      tags: [Admin]
      summary: Remove a registered endpoint — PLATFORM_ADMIN
      description: Deleting the active connection also drops the data-source override.
      security:
        - bearerAuth: []
      parameters:
        - { name: databaseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }

  /admin/databases/{databaseId}/test:
    post:
      operationId: testRemoteDatabase
      tags: [Admin]
      summary: Live connectivity probe (real JDBC connection) — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: databaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Probe outcome incl. server product/version on success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDatabaseTestResult' }

  /admin/databases/{databaseId}/activation:
    post:
      operationId: setRemoteDatabaseActivation
      tags: [Admin]
      summary: Activate as the store data source (applied on restart) — PLATFORM_ADMIN
      description: >-
        Activation requires a successful live probe, disables any previously
        active connection and writes the data-source override file read at
        startup. enabled=false deactivates the override globally.
      security:
        - bearerAuth: []
      parameters:
        - { name: databaseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated connection state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDatabase' }

  /admin/databases/deactivate:
    post:
      operationId: deactivateRemoteDatabases
      tags: [Admin]
      summary: Deactivate the remote data-source override — PLATFORM_ADMIN
      description: >-
        Clears the data-source override file read at startup so the store boots
        from its configured local data source again (applied on restart).
        Equivalent to setting enabled=false, provided as an explicit escape hatch.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Override deactivated

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [Admin]
