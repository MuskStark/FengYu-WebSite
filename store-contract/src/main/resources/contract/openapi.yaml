        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upstream' }

  /admin/upstreams/{upstreamId}/sync:
    post:
      operationId: syncUpstream
      tags: [Admin]
      summary: Start an aggregation run in the background; the console polls the source's syncStatus
      security:
        - bearerAuth: []
      parameters:
        - { name: upstreamId, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Run accepted; the source is returned with syncStatus SYNCING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upstream' }

  /admin/upstreams/{upstreamId}/sync-runs:
    get:
      operationId: listUpstreamSyncRuns
      tags: [Admin]
      summary: Recent sync runs of one source, newest first — the admin sync log
      security:
        - bearerAuth: []
      parameters:
        - { name: upstreamId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sync runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UpstreamSyncRun' }

  /organizations:
    post:
      operationId: createOrganization
      tags: [Organizations]
      summary: Create an organization; reserves the matching namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
                name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }

  /organizations/{organizationId}/webhooks:
    get:
      operationId: listWebhooks
      tags: [Organizations]
      summary: List organization webhooks
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
    post:
      operationId: createWebhook
      tags: [Organizations]
      summary: Register a webhook for publishing / review / security events
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
                  example: [release.published, release.quarantined]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }

  /organizations/{organizationId}/members:
    get:
      operationId: listOrgMembers
      tags: [Organizations]
      summary: List organization members and their roles (membership required)
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrganizationMember' }
    post:
      operationId: addOrgMember
      tags: [Organizations]
      summary: Add a member by account email — ORG_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationMember' }

  /organizations/{organizationId}/members/{memberId}:
    delete:
      operationId: removeOrgMember
      tags: [Organizations]
      summary: Remove a member (the owner cannot be removed) — ORG_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }

  /organizations/{organizationId}/members/{memberId}/role:
    put:
      operationId: changeOrgMemberRole
      tags: [Organizations]
      summary: Change a member's role (the owner's role is fixed) — ORG_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [USER, PUBLISHER, ORG_ADMIN, REVIEWER, PLATFORM_ADMIN] }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationMember' }

  /organizations/{organizationId}/audit-events:
    get:
      operationId: listOrgAuditEvents
      tags: [Organizations]
      summary: Audit events touching this organization (membership required)
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }

  /status:
    get:
      operationId: getServiceStatus
      tags: [Status]
      summary: Public service status with per-component 90-day uptime history (anonymous access)
      security:
        - {}
      responses:
        '200':
          description: Status page snapshot; probes run live and are sampled into the history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusPage' }

  /status/incidents:
    get:
      operationId: listServiceIncidents
      tags: [Status]
      summary: Past incidents, newest first (anonymous access)
      security:
        - {}
      responses:
        '200':
          description: Incident feed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }

  /status/monitor:
    get:
      operationId: getStatusMonitorLink
      tags: [Status]
      summary: Public address of the standalone monitor's status page (anonymous access)
      description: >-
        Runtime-configured (STORE_MONITOR_PUBLIC_URL) so prebuilt images can
        point the SPA's /status deep link at the deployment's monitor without
        rebuilding. url is null when the deployment has not configured one.
      security:
        - {}
      responses:
        '200':
          description: Monitor link; url is null when unconfigured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorLink' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ProblemUnauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemForbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemNotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemConflict:
      description: Conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ListingType:
      type: string
      enum: [APP, PLUGIN, SKILL, MCP, FLOW]
    Channel:
      type: string
      enum: [stable, rc, beta, alpha, nightly, private]
    Platform:
      type: string
      enum: [windows, macos, linux, universal]
    Arch:
      type: string
      enum: [x64, arm64, universal]
    ArtifactKind:
      type: string
      enum: [PACKAGE, INSTALLER, PORTABLE, CHECKSUMS, SIGNATURE, SBOM]

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Stable machine-readable code }
        detail: { type: string }
        traceId: { type: string }
        parameters:
          type: object
          additionalProperties: true

    CatalogItem:
      type: object
      required: [coordinate, type, namespace, slug, name]
      properties:
        coordinate: { type: string, example: 'infinia://plugin/official/markdown' }
        type: { $ref: '#/components/schemas/ListingType' }
        namespace: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        iconUrl: { type: string, format: uri }
        latestVersion: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        downloads: { type: integer, format: int64 }
        publisherName: { type: string }
        updatedAt: { type: string, format: date-time }
        featured: { type: boolean, description: Editorial featuring (admin) }
        minBeeLevel: { type: integer, minimum: 0, maximum: 4, description: 'Infinia Level gate: 0 = public; 1..4 restricts view/download to accounts at or above that level' }

    CatalogPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
        nextCursor: { type: string, nullable: true }
        totalEstimate: { type: integer, format: int64 }

    Localization:
      type: object
      properties:
        locale: { type: string, example: en }
        name: { type: string }
        summary: { type: string }
        descriptionMarkdown: { type: string }
        changelogMarkdown: { type: string }

    Artifact:
      type: object
      required: [artifactId, kind, platform, arch, filename, size]
      properties:
        artifactId: { type: string }
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        platform: { $ref: '#/components/schemas/Platform' }
        arch: { $ref: '#/components/schemas/Arch' }
        variant: { type: string, description: APP build variant (lite, jre, uos, jar); default for non-APP artifacts }
        filename: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, nullable: true, description: Absent for live upstream delivery }
        keyId: { type: string }
        mimeType: { type: string }

    Dependency:
      type: object
      properties:
        coordinate: { type: string }
        range: { type: string }
        optional: { type: boolean }

    Permission:
      type: object
      properties:
        permissionId: { type: string }
        scope: { type: string, example: network }
        required: { type: boolean }
        reason: { type: string }

    ListingRelease:
      type: object
      required: [releaseId, version, status, channel]
      properties:
        releaseId: { type: string }
        version: { type: string }
        status: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        requiresHost: { type: string }
        license: { type: string }
        sourceUrl: { type: string }
        changelogMarkdown: { type: string }
        rolloutPercent: { type: integer, minimum: 0, maximum: 100 }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }

    ListingDetail:
      type: object
      required: [listingId, coordinate, type, namespace, slug]
      properties:
        listingId: { type: string }
        coordinate: { type: string }
        type: { $ref: '#/components/schemas/ListingType' }
        namespace: { type: string }
        slug: { type: string }
        visibility: { type: string, enum: [PUBLIC, UNLISTED, PRIVATE] }
        status: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        iconUrl: { type: string, format: uri, nullable: true }
        screenshots: { type: array, items: { type: string, format: uri } }
        defaultChannel: { $ref: '#/components/schemas/Channel' }
        publisherName: { type: string }
        downloads: { type: integer, format: int64 }
        favorites: { type: integer, format: int64 }
        minBeeLevel: { type: integer, minimum: 0, maximum: 4, description: 'Infinia Level gate: 0 = public; 1..4 restricts view/download to accounts at or above that level' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        localizations: { type: array, items: { $ref: '#/components/schemas/Localization' } }
        releases: { type: array, items: { $ref: '#/components/schemas/ListingRelease' } }
        upstream: { $ref: '#/components/schemas/UpstreamProvenance' }

    UpstreamProvenance:
      type: object
      description: Metadata provenance for an aggregated upstream artifact. The sync
        materializes the payload into the store's blob storage, so the entry ships
        like any publisher upload with a real, platform-signed digest.
      properties:
        sourceName: { type: string }
        externalId: { type: string }
        sourceUrl: { type: string, format: uri }
        sourcePath: { type: string }
        ref: { type: string }
        commitSha: { type: string }
        upstreamVersion: { type: string }
        metadataSha256: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        deliveryMode: { type: string, enum: [MATERIALIZED_BLOB] }

    ClientEnvironment:
      type: object
      required: [hostVersion, os, arch]
      properties:
        hostVersion: { type: string }
        os: { $ref: '#/components/schemas/Platform' }
        arch: { $ref: '#/components/schemas/Arch' }
        channel: { $ref: '#/components/schemas/Channel' }
        installed:
          type: array
          items:
            type: object
            properties:
              coordinate: { type: string }
              version: { type: string }

    ResolveRequest:
      type: object
      required: [coordinate, client]
      properties:
        coordinate: { type: string, example: 'infinia://flow/summer/mail-digest' }
        range: { type: string, example: '>=1.0.0 <2.0.0' }
        client: { $ref: '#/components/schemas/ClientEnvironment' }

    ResolutionItem:
      type: object
      properties:
        coordinate: { type: string }
        releaseId: { type: string }
        version: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        requiresHost: { type: string }
        alreadyInstalled: { type: boolean }
        reason: { type: string }

    MissingDependency:
      type: object
      properties:
        coordinate: { type: string }
        range: { type: string }
        reason: { type: string }

    ResolveResponse:
      type: object
      properties:
        resolvable: { type: boolean }
        rootCoordinate: { type: string }
        plan: { type: array, items: { $ref: '#/components/schemas/ResolutionItem' } }
        missing: { type: array, items: { $ref: '#/components/schemas/MissingDependency' } }
        resolvedAt: { type: string, format: date-time }

    DownloadTicket:
      type: object
      required: [releaseId, artifactId, url]
      properties:
        releaseId: { type: string }
        artifactId: { type: string }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        sha256: { type: string, nullable: true, description: Absent for live upstream delivery }
        signature: { type: string }
        keyId: { type: string }
        size: { type: integer, format: int64 }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 64 }
        invitationCode: { type: string, maxLength: 64, description: Required while invitation-only registration is switched on }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }

    LoginResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/PublicUser' }

    PublicUser:
      type: object
      required: [userId, email, displayName, roles]
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string } }
        beeLevel: { type: integer, minimum: 0, maximum: 4, description: 'Permanent admin-granted Infinia Level: 0 LARVA · 1 WORKER · 2 FORAGER · 3 GUARD · 4 QUEEN' }
        effectiveBeeLevel: { type: integer, minimum: 0, maximum: 4, description: 'The level the store enforces: max(beeLevel, active purchased membership level) — what badges and gates should use' }
        createdAt: { type: string, format: date-time }

    RemoteDatabase:
      type: object
      description: A registered remote database endpoint (远程数据库配置) — the sealed password is never returned.
      properties:
        databaseId: { type: string }
        name: { type: string }
        jdbcUrl: { type: string, example: 'jdbc:postgresql://db.example.com:5432/store' }
        username: { type: string }
        enabled: { type: boolean, description: True when active as the data-source override }
        lastTestedAt: { type: string, format: date-time, nullable: true }
        lastTestOk: { type: boolean, nullable: true }
        lastTestError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateRemoteDatabaseRequest:
      type: object
      required: [name, jdbcUrl, username, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        jdbcUrl: { type: string, maxLength: 500, example: 'jdbc:postgresql://db.example.com:5432/store' }
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, maxLength: 500, writeOnly: true }

    UpdateRemoteDatabaseRequest:
      type: object
      description: Partial update; a blank/absent password keeps the stored credential.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        jdbcUrl: { type: string, maxLength: 500 }
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, maxLength: 500, writeOnly: true }

    RemoteDatabaseTestResult:
      type: object
      properties:
        ok: { type: boolean }
        productName: { type: string, nullable: true, example: PostgreSQL }
        productVersion: { type: string, nullable: true, example: '16.4' }
        testedAt: { type: string, format: date-time }
        error: { type: string, nullable: true }

    DataSourceStatus:
      type: object
      description: The data source the running instance uses right now.
      properties:
        productName: { type: string, nullable: true }
        productVersion: { type: string, nullable: true }
        url: { type: string, nullable: true, description: Password-masked JDBC URL }
        username: { type: string, nullable: true }
        remoteOverrideActive: { type: boolean, description: True when a remote database activated in the console is in effect }
        overrideName: { type: string, nullable: true }

    AdminUser:
      type: object
      description: Admin-console view of one account (user management).
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string } }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        beeLevel: { type: integer, minimum: 0, maximum: 4, description: Permanent admin-granted level }
        effectiveBeeLevel: { type: integer, minimum: 0, maximum: 4, description: max(beeLevel, active purchased membership level) }
        membershipExpiresAt: { type: string, format: date-time, nullable: true, description: Active purchased membership deadline, null when none }
        mfaEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    UpdateAdminUserRequest:
      type: object
      description: Partial admin update; omitted fields keep their current values.
      properties:
        beeLevel: { type: integer, minimum: 0, maximum: 4 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        roles: { type: array, items: { type: string }, description: Full replacement role list; USER is always kept }
        displayName: { type: string, minLength: 1, maxLength: 64 }

    MembershipPlan:
      type: object
      description: A purchasable Infinia Level tier for a fixed duration (会员套餐).
      required: [planId, beeLevel, durationDays, priceFen, active, sort]
      properties:
        planId: { type: string }
        beeLevel: { type: integer, minimum: 1, maximum: 4 }
        durationDays: { type: integer, minimum: 1 }
        priceFen: { type: integer, format: int64, description: Price in fen (分) }
        active: { type: boolean }
        sort: { type: integer }

    MembershipStatus:
      type: object
      description: The caller's ladder position and payable channels.
      required: [baseBeeLevel, effectiveBeeLevel, channels]
      properties:
        baseBeeLevel: { type: integer, minimum: 0, maximum: 4 }
        effectiveBeeLevel: { type: integer, minimum: 0, maximum: 4 }
        membershipLevel: { type: integer, minimum: 1, maximum: 4, nullable: true, description: Active purchased membership level, null when none }
        membershipExpiresAt: { type: string, format: date-time, nullable: true }
        channels: { type: array, items: { type: string, enum: [WECHAT, ALIPAY, BMAC, MOCK] }, description: Gateway channels the configured credentials support }

    CreateMembershipOrderRequest:
      type: object
      required: [planId]
      properties:
        planId: { type: string }
        channel: { type: string, enum: [WECHAT, ALIPAY, BMAC, MOCK], description: Defaults to the first configured channel }

    MembershipOrder:
      type: object
      required: [orderNo, targetLevel, durationDays, priceFen, status, channel, createdAt, expiresAt]
      properties:
        orderNo: { type: string }
        targetLevel: { type: integer, minimum: 1, maximum: 4 }
        durationDays: { type: integer }
        priceFen: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, PAID, CLOSED] }
        channel: { type: string }
        payUrl: { type: string, nullable: true, description: Cashier URL; only present while PENDING (one-shot, short-lived) }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, description: End of the payment window }

    AdminMembershipPlan:
      type: object
      required: [planId, beeLevel, durationDays, priceFen, active, sort, createdAt, updatedAt]
      properties:
        planId: { type: string }
        beeLevel: { type: integer, minimum: 1, maximum: 4 }
        durationDays: { type: integer, minimum: 1 }
        priceFen: { type: integer, format: int64 }
        active: { type: boolean }
        sort: { type: integer }
        externalUrl: { type: string, format: uri, nullable: true, description: Plan-specific checkout link (e.g. a Buy Me a Coffee Extra); null = gateway-built checkout }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminPlanRequest:
      type: object
      description: Plan terms; create requires beeLevel/durationDays/priceFen, update is partial.
      properties:
        beeLevel: { type: integer, minimum: 1, maximum: 4, description: 1 WORKER .. 4 QUEEN; LARVA is not purchasable }
        durationDays: { type: integer, minimum: 1 }
        priceFen: { type: integer, format: int64, minimum: 0 }
        active: { type: boolean }
        sort: { type: integer }
        externalUrl: { type: string, format: uri, maxLength: 512, description: Absolute http(s) checkout link for hosted gateways (Buy Me a Coffee Extra); blank clears it }

    AdminMembershipOrder:
      type: object
      required: [orderNo, userId, targetLevel, durationDays, priceFen, status, channel, createdAt, expiresAt]
      properties:
        orderNo: { type: string }
        userId: { type: string }
        email: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        targetLevel: { type: integer, minimum: 1, maximum: 4 }
        durationDays: { type: integer }
        priceFen: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, PAID, CLOSED] }
        channel: { type: string }
        gatewayTradeNo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time }

    RegistrationPolicy:
      type: object
      description: Whether the store currently requires invitation codes to register (邀请注册开关).
      required: [invitationRequired]
      properties:
        invitationRequired: { type: boolean }

    UpdateRegistrationPolicyRequest:
      type: object
      required: [invitationRequired]
      properties:
        invitationRequired: { type: boolean }

    InvitationCode:
      type: object
      description: A single-use registration invitation code (邀请码).
      required: [codeId, code, createdBy, createdAt]
      properties:
        codeId: { type: string }
        code: { type: string }
        createdBy: { type: string }
        createdByEmail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        usedBy: { type: string, nullable: true, description: The account that registered with this code, null while unused }
        usedByEmail: { type: string, nullable: true }
        usedAt: { type: string, format: date-time, nullable: true }

    MyInvitations:
      type: object
      description: The caller's invitation share surface — quota, usage and issued codes.
      required: [unlimited, monthlyLimit, issuedThisMonth, invitations]
      properties:
        unlimited: { type: boolean, description: True for platform admins (no monthly limit) }
        monthlyLimit: { type: integer, description: "Codes shareable this calendar month (L2: 2, L3: 5, L4: 10; 0 below L2)" }
        issuedThisMonth: { type: integer }
        invitations:
          type: array
          items: { $ref: '#/components/schemas/InvitationCode' }

    Session:
      type: object
      properties:
        sessionId: { type: string }
        clientId: { type: string }
        kind: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        remoteIpHash: { type: string }

    Device:
      type: object
      properties:
        deviceId: { type: string }
        publicId: { type: string }
        name: { type: string }
        platform: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revoked: { type: boolean }

    Favorite:
      type: object
      properties:
        listingCoordinate: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/ListingType' }
        latestVersion: { type: string }
        addedAt: { type: string, format: date-time }

    Entitlement:
      type: object
      properties:
        listingCoordinate: { type: string }
        free: { type: boolean }
        acquiredAt: { type: string, format: date-time }

    InstallEvent:
      type: object
      required: [idempotencyKey, coordinate, version, action, outcome]
      properties:
        idempotencyKey: { type: string, maxLength: 128 }
        coordinate: { type: string }
        version: { type: string }
        type: { $ref: '#/components/schemas/ListingType' }
        action: { type: string, enum: [install, update, rollback, uninstall] }
        outcome: { type: string, enum: [success, failure, rolled_back] }
        hostVersion: { type: string }
        os: { type: string }
        arch: { type: string }
        occurredAt: { type: string, format: date-time }

    Library:
      type: object
      properties:
        favorites: { type: array, items: { $ref: '#/components/schemas/Favorite' } }
        entitlements: { type: array, items: { $ref: '#/components/schemas/Entitlement' } }
        installHistory: { type: array, items: { $ref: '#/components/schemas/InstallEvent' } }

    CreateListingRequest:
      type: object
      required: [namespace, slug, type, name]
      properties:
        namespace: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        type: { $ref: '#/components/schemas/ListingType' }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        defaultChannel: { $ref: '#/components/schemas/Channel' }
        name: { type: string, minLength: 1, maxLength: 100 }
        summary: { type: string, maxLength: 500 }
        descriptionMarkdown: { type: string, maxLength: 50000 }
        locale: { type: string, default: en }
        minBeeLevel: { type: integer, minimum: 0, maximum: 4, default: 0, description: 'Infinia Level gate the publisher sets: 0 = public; 1..4 = only signed-in accounts at or above that level may view and download' }

    CreateReleaseRequest:
      type: object
      required: [version, channel]
      properties:
        version: { type: string, example: 1.2.0 }
        channel: { $ref: '#/components/schemas/Channel' }
        requiresHost: { type: string, example: '>=4.0.0-beta.5 <5.0.0' }
        license: { type: string, example: MIT }
        sourceUrl: { type: string, format: uri }
        changelogMarkdown: { type: string, maxLength: 50000 }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        rolloutPercent: { type: integer, minimum: 0, maximum: 100, default: 100 }

    UploadSession:
      type: object
      required: [uploadId, releaseId, uploadUrl, method]
      properties:
        uploadId: { type: string }
        releaseId: { type: string }
        filename: { type: string }
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        platform: { $ref: '#/components/schemas/Platform' }
        arch: { $ref: '#/components/schemas/Arch' }
        variant: { type: string }
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        expiresAt: { type: string, format: date-time }
        maxSizeBytes: { type: integer, format: int64 }

    ScanFinding:
      type: object
      properties:
        severity: { type: string, enum: [INFO, WARN, ERROR, CRITICAL] }
        rule: { type: string }
        message: { type: string }

    SubmitResult:
      type: object
      properties:
        releaseId: { type: string }
        status: { type: string }
        reviewId: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }

    PublisherRelease:
      type: object
      required: [releaseId, listingCoordinate, version, status, channel]
      properties:
        releaseId: { type: string }
        listingCoordinate: { type: string }
        version: { type: string }
        status: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        findings: { type: array, items: { $ref: '#/components/schemas/ScanFinding' } }

    Review:
      type: object
      required: [reviewId, releaseId, status]
      properties:
        reviewId: { type: string }
        releaseId: { type: string }
        listingCoordinate: { type: string }
        listingName: { type: string }
        version: { type: string }
        status: { type: string }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        reviewerId: { type: string, nullable: true }
        notes: { type: string }
        findings: { type: array, items: { $ref: '#/components/schemas/ScanFinding' } }

    Organization:
      type: object
      properties:
        organizationId: { type: string }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    Webhook:
      type: object
      properties:
        webhookId: { type: string }
        organizationId: { type: string }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    Rating:
      type: object
      properties:
        ratingId: { type: string }
        userId: { type: string }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        updatedAt: { type: string, format: date-time }

    RatingSummary:
      type: object
      properties:
        count: { type: integer, format: int64 }
        average: { type: number }

    RatingsPage:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/RatingSummary' }
        ratings: { type: array, items: { $ref: '#/components/schemas/Rating' } }

    UpsertRatingRequest:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }

    ReportRequest:
      type: object
      required: [coordinate, reason]
      properties:
        coordinate: { type: string, example: 'infinia://plugin/official/markdown' }
        reason: { type: string, enum: [malware, policy_violation, spam, misleading, license, other] }
        details: { type: string, maxLength: 2000 }

    Report:
      type: object
      properties:
        reportId: { type: string }
        listingCoordinate: { type: string }
        listingName: { type: string }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [OPEN, ACTIONED, DISMISSED] }
        resolutionNote: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    ResolveReportRequest:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [ACTIONED, DISMISSED] }
        note: { type: string, maxLength: 1000 }

    AuditEvent:
      type: object
      properties:
        eventId: { type: string }
        actorType: { type: string }
        actorId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        beforeSummary: { type: string }
        afterSummary: { type: string }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }

    OrganizationMember:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { type: string }
        joinedAt: { type: string, format: date-time }
        owner: { type: boolean }

    AddMemberRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [USER, PUBLISHER, ORG_ADMIN] , default: PUBLISHER }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }

    ChangePasswordResult:
      type: object
      properties:
        succeeded: { type: boolean }
        message: { type: string }

    InstalledItem:
      type: object
      properties:
        coordinate: { type: string }
        version: { type: string }
        type: { type: string }
        latestVersion: { type: string, nullable: true }
        latestChannel: { type: string, nullable: true }
        updateAvailable: { type: boolean }

    AdminListing:
      type: object
      properties:
        listingId: { type: string }
        coordinate: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string }
        visibility: { type: string, enum: [PUBLIC, UNLISTED, PRIVATE] }
        latestVersion: { type: string, nullable: true }
        featured: { type: boolean }
        minBeeLevel: { type: integer, minimum: 0, maximum: 4 }
        downloads: { type: integer, format: int64 }

    AdminAppUploadStart:
      type: object
      required: [filename]
      properties:
        version: { type: string, description: SemVer of the update package — inferred from the filename when omitted }
        channel: { type: string, enum: [stable, rc, beta, alpha, nightly], description: Inferred from the version's pre-release suffix when omitted }
        changelog: { type: string, description: Optional release notes }
        filename: { type: string, description: Package filename — version/channel/kind/platform/arch/variant are inferred from it }
        size: { type: integer, format: int64, description: Declared byte size }

    AdminAppUploadSession:
      type: object
      required: [releaseId, version, uploadUrl, method]
      properties:
        listingId: { type: string }
        releaseId: { type: string }
        version: { type: string, description: The (possibly inferred) release version }
        channel: { type: string, description: The (possibly inferred) release channel }
        uploadUrl: { type: string, description: Server-relative presigned PUT URL }
        method: { type: string, enum: [PUT] }
        kind: { type: string }
        platform: { type: string }
        arch: { type: string }
        variant: { type: string }
        expiresAt: { type: string }

    AdminAppArtifact:
      type: object
      properties:
        filename: { type: string }
        kind: { type: string }
        platform: { type: string }
        arch: { type: string }
        variant: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }

    AdminAppRelease:
      type: object
      properties:
        releaseId: { type: string }
        version: { type: string }
        channel: { type: string }
        status: { type: string }
        publishedAt: { type: string, nullable: true }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/AdminAppArtifact' }

    Upstream:
      type: object
      properties:
        upstreamId: { type: string }
        name: { type: string }
        marketplaceUrl: { type: string, format: uri }
        targetNamespace: { type: string }
        adapterType: { type: string, enum: [AUTO, CLAUDE_MARKETPLACE, SKILL_REPOSITORY, MCP_REGISTRY, SKILLHUB_REGISTRY] }
        enabled: { type: boolean }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        lastSyncOk: { type: boolean, nullable: true }
        lastError: { type: string, nullable: true }
        syncStatus: { type: string, nullable: true, enum: [SYNCING, OK, FAILED], description: Latest-run state; null before the first run }
        lastRunStartedAt: { type: string, format: date-time, nullable: true }
        lastRunImported: { type: integer, nullable: true }
        lastRunSkipped: { type: integer, nullable: true }
        lastRunFailed: { type: integer, nullable: true }

    UpstreamSyncRun:
      type: object
      properties:
        runId: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        imported: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        status: { type: string, enum: [RUNNING, OK, PARTIAL] }
        errors:
          type: array
          items: { type: string }

    CreateUpstreamRequest:
      type: object
      required: [name, marketplaceUrl, targetNamespace]
      properties:
        name: { type: string, maxLength: 100 }
        marketplaceUrl: { type: string, format: uri }
        targetNamespace: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        adapterType: { type: string, enum: [AUTO, CLAUDE_MARKETPLACE, SKILL_REPOSITORY, MCP_REGISTRY, SKILLHUB_REGISTRY] }

    UpstreamSyncResult:
      type: object
      properties:
        upstream: { type: string }
        imported: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        errors: { type: array, items: { type: string } }

    FengYuCatalogEntry:
      type: object
      description: Field names mirror the FengYu host's MarketplaceCatalogEntry contract.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        author: { type: string }
        icon: { type: string, format: uri, nullable: true }
        category: { type: string }
        permissions: { type: array, items: { type: string } }
        homepage: { type: string, nullable: true }
        downloadUrl: { type: string, description: Direct HMAC-ticketed package URL }
        official: { type: boolean }
        sha256: { type: string }
        signature: { type: string, nullable: true }
        keyId: { type: string, nullable: true }

    StatusIndicator:
      type: string
      description: Overall and per-component health ladder; history days without samples report no_data.
      enum: [operational, degraded, partial_outage, major_outage, no_data]

    StatusPage:
      type: object
      required: [indicator, components, checkedAt]
      properties:
        indicator: { $ref: '#/components/schemas/StatusIndicator' }
        components:
          type: array
          items: { $ref: '#/components/schemas/StatusComponent' }
        checkedAt: { type: string, format: date-time }

    StatusComponent:
      type: object
      required: [key, indicator, history]
      properties:
        key: { type: string, example: database }
        indicator: { $ref: '#/components/schemas/StatusIndicator' }
        uptime90d: { type: number, format: double, nullable: true, description: Uptime percentage over the history window, e.g. 99.98 }
        history:
          type: array
          description: Exactly 90 entries, oldest first, ending today (UTC).
          items: { $ref: '#/components/schemas/StatusDay' }

    StatusDay:
      type: object
      required: [date, indicator]
      properties:
        date: { type: string, format: date }
        indicator: { $ref: '#/components/schemas/StatusIndicator' }
        uptimePercent: { type: number, format: double, nullable: true }

    Incident:
      type: object
      required: [incidentId, component, title, impact, status, startedAt]
      properties:
        incidentId: { type: string, format: uuid }
        component: { type: string }
        title: { type: string }
        impact: { type: string, enum: [outage, degraded] }
        status: { type: string, enum: [investigating, resolved] }
        startedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }

    MonitorLink:
      type: object
      description: Where the standalone monitor's public status page lives (ADR-011).
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: The monitor's public address, e.g. https://status.example.com; null when unconfigured.
