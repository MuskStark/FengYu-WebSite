<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/infinia-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Infinia Store</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- data-cfasync opts the entry script out of Cloudflare Rocket Loader, which
         otherwise rewrites type="module" and re-executes the bundle through its
         own loader — a repeat-offender for SPA breakage behind Cloudflare. -->
    <script type="module" src="/src/main.tsx" data-cfasync="false"></script>
  </body>
</html>
