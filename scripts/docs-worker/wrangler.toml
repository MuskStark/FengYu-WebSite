name = "infinia-docs-frontend"
main = "worker.js"
compatibility_date = "2026-09-30"

# Runs on the existing infinia.fyi zone (same Cloudflare account), in front of
# the store origin that otherwise serves www.infinia.fyi. Only the /docs*
# prefix routes here; everything else is untouched.
routes = [
  { pattern = "www.infinia.fyi/docs*", zone_name = "infinia.fyi" },
]
