# Monitor-host stack for the split deployment (ADR-011): the standalone status
# monitor runs on its OWN server so the status page survives a store outage.
# The store + its dependency plane live on another host (docker-compose.yml
# `--profile app`); this file runs only the monitor, from the CI-published
# GHCR image — no build toolchain needed on this host.
#
# Usage (this host needs only this file and a .env with MONITOR_TARGET_BASE_URL):
#   docker compose -f docker-compose.monitor.yml up -d
#   docker compose -f docker-compose.monitor.yml logs -f monitor
#
# Direct ghcr.io access can be slow/unreachable on some networks: set
# MONITOR_IMAGE_REGISTRY to a GHCR proxy (e.g. ghcr.m.daocloud.io), or build
# locally from the repo instead: see scripts/deploy.sh --monitor-host --build.
#
# Pin by digest for immutability: replace :latest with @sha256:... from
# https://github.com/MuskStark/FengYu-WebSite/pkgs/container/infinia-store-platform-monitor

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  monitor:
    image: ${MONITOR_IMAGE_REGISTRY:-ghcr.io}/muskstark/infinia-store-platform-monitor:${MONITOR_IMAGE_TAG:-latest}
    # The status page and its API are anonymous BY DESIGN (ADR-011: a status
    # page that needs a login is useless during an outage). Publish it through
    # the reverse proxy / WAF, whose CC protection is its traffic defense.
    environment:
      # The store's URL AS THIS HOST REACHES IT — through the WAF (preferred:
      # measures true external reachability) or the store host's LAN address.
      MONITOR_TARGET_BASE_URL: ${MONITOR_TARGET_BASE_URL:?set in .env — the store's URL as this host reaches it}
      MONITOR_ALERT_WEBHOOK: ${MONITOR_ALERT_WEBHOOK:-}
      # Real-time probing & SSE knobs (defaults mirror application.yml so an
      # unset .env changes nothing). Legacy MONITOR_POLL_INTERVAL_MS still
      # steers the probe cadence for deployments that tuned it.
      MONITOR_PROBE_INTERVAL_MS: ${MONITOR_PROBE_INTERVAL_MS:-${MONITOR_POLL_INTERVAL_MS:-5000}}
      MONITOR_MIRROR_INTERVAL_MS: ${MONITOR_MIRROR_INTERVAL_MS:-5000}
      MONITOR_PROBE_TIMEOUT_MS: ${MONITOR_PROBE_TIMEOUT_MS:-8000}
      MONITOR_MIRROR_TIMEOUT_MS: ${MONITOR_MIRROR_TIMEOUT_MS:-8000}
      MONITOR_CONFIRM_FAILURE_THRESHOLD: ${MONITOR_CONFIRM_FAILURE_THRESHOLD:-2}
      MONITOR_CONFIRM_RECOVERY_THRESHOLD: ${MONITOR_CONFIRM_RECOVERY_THRESHOLD:-2}
      MONITOR_OBSERVATION_VALIDITY_MS: ${MONITOR_OBSERVATION_VALIDITY_MS:-180000}
      MONITOR_SSE_MAX_CONNECTIONS: ${MONITOR_SSE_MAX_CONNECTIONS:-200}
      MONITOR_SSE_HEARTBEAT_MS: ${MONITOR_SSE_HEARTBEAT_MS:-15000}
      MONITOR_SSE_REPLAY_CAPACITY: ${MONITOR_SSE_REPLAY_CAPACITY:-1000}
    ports:
      # All interfaces by default so a WAF on another host can reach it;
      # MONITOR_BIND_HOST=127.0.0.1 tightens it for a co-located proxy.
      - "${MONITOR_BIND_HOST:-0.0.0.0}:8090:8090"
    volumes:
      - monitordata:/var/lib/infinia-monitor
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${DOCKER_CPUS_LIMIT:-2}"
          memory: "${DOCKER_MEM_LIMIT:-1g}"

volumes:
  monitordata:
