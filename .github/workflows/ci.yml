name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual "Run workflow" dispatches run the same pipeline (tests, images,
  # deploy) — the way to re-deploy the current main without a new commit.
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Maven, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'

  frontend:
    name: Frontend (Yarn 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # build-monitor-jar.sh shells out to ./mvnw, which needs a JDK 21; the
      # runner's default JDK is older and fails with "release version 21 not
      # supported".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable Yarn 4
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Regenerate API types (drift check)
        run: |
          yarn workspace @infinia/store-web gen:api
          git diff --exit-code -- store-web/src/api/schema.d.ts
      - name: Pages deployment script regressions
        run: |
          bash -n scripts/deploy-assets.sh scripts/upgrade.sh
          node --test scripts/tests/pages-assets.test.mjs
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Unit tests (store web)
        run: yarn web:test
      - name: Unit tests (monitor web)
        run: yarn monitor:test
      - name: Typecheck & build (store web)
        run: yarn web:build
      - name: Typecheck & build (monitor web)
        run: yarn monitor:build
      - name: Monitor jar embeds its SPA
        run: ./build-monitor-jar.sh --skip-tests --skip-web

  images:
    name: Images (Docker → GHCR)
    runs-on: ubuntu-latest
    # Never publish release images from a commit whose tests are red.
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GHCR image names must be lowercase; github.repository keeps its case.
      - name: Lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Store image (builds SPA + jar inside; PRs build-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Monitor image (builds SPA + jar inside; PRs build-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.monitor
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}-monitor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push-to-deploy: once backend/frontend/images are green on main (or a
  # manual workflow dispatch), SSH into the production host(s) and run
  # scripts/upgrade.sh pinned to this commit. Entirely opt-in via repository
  # secrets — without DEPLOY_SSH_HOST + DEPLOY_SSH_PRIVATE_KEY the job just
  # prints a notice and CI behaves exactly as before. One-time setup:
  # DEPLOYMENT.md "Automated deploys".
  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: [backend, frontend, images]
    # PRs never deploy (their secrets are empty anyway); pushes to main and
    # manual "Run workflow" dispatches do.
    if: github.event_name != 'pull_request'
    # One production deploy at a time — queue instead of cancelling mid-deploy.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # Surfaces the run under the repo's Environments → production tab; add
    # required reviewers there for a click-to-approve production gate.
    environment: production
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH (store host, then monitor host when configured)
        env:
          # Store host: DEPLOY_SSH_HOST + DEPLOY_SSH_PRIVATE_KEY enable it.
          STORE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          STORE_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          STORE_USER: ${{ secrets.DEPLOY_SSH_USER || 'root' }}
          STORE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          STORE_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          STORE_PATH: ${{ secrets.DEPLOY_PATH || '/opt/infinia-store' }}
          # Monitor host (split deployment): pulls the fresh GHCR image.
          # Defaults to the store host's key/user/port; leave
          # DEPLOY_MONITOR_SSH_HOST unset to skip (single-host installs ship
          # the monitor with the store above).
          MON_HOST: ${{ secrets.DEPLOY_MONITOR_SSH_HOST }}
          MON_PORT: ${{ secrets.DEPLOY_MONITOR_SSH_PORT || secrets.DEPLOY_SSH_PORT || '22' }}
          MON_USER: ${{ secrets.DEPLOY_MONITOR_SSH_USER || secrets.DEPLOY_SSH_USER || 'root' }}
          MON_KEY: ${{ secrets.DEPLOY_MONITOR_SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_PRIVATE_KEY }}
          MON_KNOWN_HOSTS: ${{ secrets.DEPLOY_MONITOR_KNOWN_HOSTS || secrets.DEPLOY_KNOWN_HOSTS }}
          MON_PATH: ${{ secrets.DEPLOY_MONITOR_PATH || secrets.DEPLOY_PATH || '/opt/infinia-store' }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p ~/.ssh
          umask 177

          # ssh_run <port> <user> <host> <keyfile> <known_hosts_file> <command>
          # Known-hosts file provided → strict pinning; absent → trust on
          # first use (set DEPLOY_KNOWN_HOSTS to lock this down).
          ssh_run() {
            local port=$1 user=$2 host=$3 key=$4 kh=$5; shift 5
            local strict=yes
            if [[ ! -s $kh ]]; then : >"$kh"; strict=accept-new; fi
            ssh -i "$key" -p "$port" -o BatchMode=yes \
                -o StrictHostKeyChecking="$strict" -o UserKnownHostsFile="$kh" \
                -o ServerAliveInterval=30 \
                "$user@$host" "$*"
          }

          if [[ -n $STORE_HOST && -n $STORE_KEY ]]; then
            printf '%s\n' "$STORE_KEY" > ~/.ssh/deploy_store
            if [[ -n $STORE_KNOWN_HOSTS ]]; then
              printf '%s\n' "$STORE_KNOWN_HOSTS" > ~/.ssh/kh_store
            fi
            echo "==> store host $STORE_HOST:$STORE_PORT — deploying ${GITHUB_SHA:0:12} to $STORE_PATH"
            ssh_run "$STORE_PORT" "$STORE_USER" "$STORE_HOST" ~/.ssh/deploy_store ~/.ssh/kh_store \
              "cd '$STORE_PATH' && bash scripts/upgrade.sh --ref '$GITHUB_SHA'"
          else
            echo "::notice title=Deploy skipped::DEPLOY_SSH_HOST / DEPLOY_SSH_PRIVATE_KEY secrets are not set — automated deploy disabled (setup: DEPLOYMENT.md, Automated deploys)"
          fi

          if [[ -n $MON_HOST && -n $MON_KEY ]]; then
            printf '%s\n' "$MON_KEY" > ~/.ssh/deploy_monitor
            if [[ -n $MON_KNOWN_HOSTS ]]; then
              printf '%s\n' "$MON_KNOWN_HOSTS" > ~/.ssh/kh_monitor
            fi
            echo "==> monitor host $MON_HOST:$MON_PORT — pulling the new image"
            ssh_run "$MON_PORT" "$MON_USER" "$MON_HOST" ~/.ssh/deploy_monitor ~/.ssh/kh_monitor \
              "cd '$MON_PATH' && docker compose -f docker-compose.monitor.yml pull && docker compose -f docker-compose.monitor.yml up -d"
          else
            echo "::notice title=Monitor deploy skipped::DEPLOY_MONITOR_SSH_HOST is not set (only needed for the split deployment)"
          fi
