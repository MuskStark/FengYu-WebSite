name: Docs Worker

# Deploys the zone Worker that mounts the docs as www.infinia.fyi/docs* —
# see scripts/docs-worker/README.md. Manual only: the Worker changes with the
# repo, not with every docs rebuild (those ship via FengYu's docs.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets expected in the repo's "CloudFlare" environment:
    #   CF_WORKERS_TOKEN — Cloudflare API token, "Edit Cloudflare Workers"
    #                      template + Zone:Edit on infinia.fyi (for the route)
    #   CF_ACCOUNT_ID    — the account hosting the zone
    environment: CloudFlare
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_WORKERS_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: scripts/docs-worker
          command: deploy
