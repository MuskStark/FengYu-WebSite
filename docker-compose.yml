# Local development / production stack for FengYu-WebSite
# (design §4 "Cloud" plane).
#
# Dependency plane (default):        docker compose up -d
# Store host (split deployment):      docker compose --profile app up -d
# Plus co-located monitor:            docker compose --profile app --profile monitor up -d
#
# The app profile runs the store under the `prod` Spring profile against this
# stack's PostgreSQL and MinIO. Copy .env.example to .env and fill in the
# STORE_* secrets first — ProductionHardeningCheck aborts startup on the
# dev-only defaults, so the app cannot silently boot with public credentials.
#
# The monitor lives in its own profile: in the split deployment it runs on its
# own host from docker-compose.monitor.yml (the standalone status page must
# survive a store outage, ADR-011); add the `monitor` profile here only for
# single-host installs.
#
# TLS/WAF termination is out of scope by design: both apps publish directly
# and are expected behind a dedicated reverse proxy / WAF (see DEPLOYMENT.md
# for the SafeLine setup).

# Docker's json-file log driver has no rotation by default; without these a
# chatty app eventually fills the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-default-limits: &default-limits
  deploy:
    resources:
      limits:
        # Env-tunable so operators can size for their host; these defaults fit
        # a modest single-box deployment alongside the proxy/WAF.
        cpus: "${DOCKER_CPUS_LIMIT:-2}"
        memory: "${DOCKER_MEM_LIMIT:-1g}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      # Dev default is fine while the port stays loopback-bound; any real
      # deployment overrides it in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store}
    ports:
      # Loopback-only: these ports carry the stack's credentials and must not
      # be reachable from the LAN on laptop deployments.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-store} -d ${POSTGRES_DB:-store}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    <<: *default-limits

  # Reserved by the platform design (§3.5: cache, rate limiting, one-time
  # state) but not yet wired into the application — it ships with the stack so
  # the dependency plane matches the documented architecture.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    <<: *default-limits

  # Official MinIO images are discontinued upstream (CVE-2025-62506 fixed only
  # in source); this is the final published tag, so at least it cannot drift.
  # Re-evaluate on the production host (`docker manifest inspect`) — see
  # DEPLOYMENT.md.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-store}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-store-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    <<: *default-limits

  # One-shot: creates the bucket the store's S3 storage mode expects, so
  # `store.storage.type=s3` works against this stack without manual steps.
  minio-init:
    # Frozen upstream like minio/minio; `latest` no longer drifts.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # Compose-time interpolation (same source as the minio service's env), so
    # the alias always carries the credentials MinIO actually booted with.
    entrypoint: >
      /bin/sh -c "
      mc alias set store http://minio:9000 ${MINIO_ROOT_USER:-store} ${MINIO_ROOT_PASSWORD:-store-secret} &&
      mc mb --ignore-existing store/store-blobs"
    logging: *default-logging

  # The store itself, built from the repo Dockerfile. Opt-in via
  # `docker compose --profile app up -d store` so the plain
  # `docker compose up -d` dependency-stack behaviour is unchanged.
  store:
    build:
      context: .
      args:
      # Mirror for the image build's Maven downloads (slow links to Maven
      # Central); empty keeps Maven Central. See .env.example MAVEN_MIRROR.
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
        # Absolute origin baked in for the SPA's hashed assets when they are
        # published to Cloudflare Pages; empty keeps assets same-origin.
        # Must match the CI publish build (see .env.example ASSETS_BASE_URL).
        ASSETS_BASE_URL: ${ASSETS_BASE_URL:-}
    image: infinia-webservice
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # prod profile: real datasource below + ProductionHardeningCheck rejects
      # the dev-only secrets, so this service cannot boot with public defaults.
      SPRING_PROFILES_ACTIVE: prod
      STORE_BASE_URL: ${STORE_BASE_URL:-http://localhost:8080}
      # Public address of the standalone monitor's status page — the SPA's
      # /status link hands off to it at runtime (no image rebuild needed).
      STORE_MONITOR_PUBLIC_URL: ${STORE_MONITOR_PUBLIC_URL:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-store}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-store}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-store}
      STORE_STORAGE_TYPE: s3
      STORE_STORAGE_S3_ENDPOINT: http://minio:9000
      STORE_STORAGE_S3_BUCKET: store-blobs
      STORE_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-store}
      STORE_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-store-secret}
      STORE_TICKET_SECRET: ${STORE_TICKET_SECRET:?set in .env — ProductionHardeningCheck refuses the dev default}
      STORE_ROLLOUT_SECRET: ${STORE_ROLLOUT_SECRET:?set in .env — ProductionHardeningCheck refuses the dev default}
      STORE_CLI_CLIENT_SECRET: ${STORE_CLI_CLIENT_SECRET:?set in .env — ProductionHardeningCheck refuses the dev default}
      # Default SkillHub upstream (design §2.1: hosts configure only the store);
      # disable or retarget it per deployment.
      STORE_UPSTREAM_DEFAULTS_ENABLED: ${STORE_UPSTREAM_DEFAULTS_ENABLED:-true}
      STORE_UPSTREAM_SKILLHUB_URL: ${STORE_UPSTREAM_SKILLHUB_URL:-https://api.skillhub.cn/api/skills?pages=1}
      # Status sampling tiers (defaults mirror application.yml): core services
      # every 5 s, resource metrics every 30 s, 2-failure/2-success confirmation.
      STORE_STATUS_CORE_INTERVAL_MS: ${STORE_STATUS_CORE_INTERVAL_MS:-5000}
      STORE_STATUS_METRICS_INTERVAL_MS: ${STORE_STATUS_METRICS_INTERVAL_MS:-30000}
      STORE_STATUS_CONFIRM_FAILURE: ${STORE_STATUS_CONFIRM_FAILURE:-2}
      STORE_STATUS_CONFIRM_RECOVERY: ${STORE_STATUS_CONFIRM_RECOVERY:-2}
      STORE_STATUS_OBSERVATION_VALIDITY_MS: ${STORE_STATUS_OBSERVATION_VALIDITY_MS:-180000}
      # Membership purchase gateways: all optional — the first configured one
      # wins (bmac → epay → xunhu); unset means the purchase page reports
      # payment_not_configured and nothing else changes.
      STORE_PAY_BMAC_PAGE_URL: ${STORE_PAY_BMAC_PAGE_URL:-}
      STORE_PAY_BMAC_WEBHOOK_SECRET: ${STORE_PAY_BMAC_WEBHOOK_SECRET:-}
      STORE_PAY_BMAC_MATCH_WINDOW_MINUTES: ${STORE_PAY_BMAC_MATCH_WINDOW_MINUTES:-1440}
      STORE_PAY_EPAY_API_BASE: ${STORE_PAY_EPAY_API_BASE:-}
      STORE_PAY_EPAY_PID: ${STORE_PAY_EPAY_PID:-}
      STORE_PAY_EPAY_KEY: ${STORE_PAY_EPAY_KEY:-}
      STORE_PAY_XUNHU_API_BASE: ${STORE_PAY_XUNHU_API_BASE:-https://api.xunhupay.com}
      STORE_PAY_XUNHU_WECHAT_APPID: ${STORE_PAY_XUNHU_WECHAT_APPID:-}
      STORE_PAY_XUNHU_WECHAT_APPSECRET: ${STORE_PAY_XUNHU_WECHAT_APPSECRET:-}
      STORE_PAY_XUNHU_ALIPAY_APPID: ${STORE_PAY_XUNHU_ALIPAY_APPID:-}
      STORE_PAY_XUNHU_ALIPAY_APPSECRET: ${STORE_PAY_XUNHU_ALIPAY_APPSECRET:-}
      STORE_PAY_ORDER_EXPIRE_MINUTES: ${STORE_PAY_ORDER_EXPIRE_MINUTES:-30}
    ports:
      # All interfaces by default: a WAF on another host (or LAN clients)
      # reaches it directly. Restrict with STORE_BIND_HOST=127.0.0.1 when the
      # proxy is co-located, and firewall the port to the WAF only via the
      # DOCKER-USER chain (see DEPLOYMENT.md; plain ufw does not filter
      # Docker-published ports).
      - "${STORE_BIND_HOST:-0.0.0.0}:8080:8080"
    volumes:
      - storedata:/var/lib/infinia-store
    restart: unless-stopped
    logging: *default-logging
    <<: *default-limits

  # Standalone status monitor (ADR-011), built from Dockerfile.monitor. Own
  # profile: the split deployment runs it on a separate host via
  # docker-compose.monitor.yml; enable it here only for single-host installs
  # (hence the depends_on the store, which only applies when co-located).
  # Its API and page are anonymous BY DESIGN (ADR-011) — published through
  # the reverse proxy / WAF, which provides CC protection.
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: infinia-monitor
    profiles: ["monitor"]
    depends_on:
      store:
        condition: service_healthy
    environment:
      # Default probes the store inside the compose network; set the store's
      # PUBLIC https:// URL in .env to measure true external reachability
      # through the proxy/WAF instead.
      MONITOR_TARGET_BASE_URL: ${MONITOR_TARGET_BASE_URL:-http://store:8080}
      MONITOR_ALERT_WEBHOOK: ${MONITOR_ALERT_WEBHOOK:-}
      # Real-time probing & SSE knobs (defaults mirror application.yml; the
      # legacy MONITOR_POLL_INTERVAL_MS still steers the probe cadence).
      MONITOR_PROBE_INTERVAL_MS: ${MONITOR_PROBE_INTERVAL_MS:-${MONITOR_POLL_INTERVAL_MS:-5000}}
      MONITOR_MIRROR_INTERVAL_MS: ${MONITOR_MIRROR_INTERVAL_MS:-5000}
      MONITOR_PROBE_TIMEOUT_MS: ${MONITOR_PROBE_TIMEOUT_MS:-8000}
      MONITOR_MIRROR_TIMEOUT_MS: ${MONITOR_MIRROR_TIMEOUT_MS:-8000}
      MONITOR_CONFIRM_FAILURE_THRESHOLD: ${MONITOR_CONFIRM_FAILURE_THRESHOLD:-2}
      MONITOR_CONFIRM_RECOVERY_THRESHOLD: ${MONITOR_CONFIRM_RECOVERY_THRESHOLD:-2}
      MONITOR_OBSERVATION_VALIDITY_MS: ${MONITOR_OBSERVATION_VALIDITY_MS:-180000}
      MONITOR_SSE_MAX_CONNECTIONS: ${MONITOR_SSE_MAX_CONNECTIONS:-200}
      MONITOR_SSE_HEARTBEAT_MS: ${MONITOR_SSE_HEARTBEAT_MS:-15000}
      MONITOR_SSE_REPLAY_CAPACITY: ${MONITOR_SSE_REPLAY_CAPACITY:-1000}
    ports:
      # Same rule as the store: MONITOR_BIND_HOST=127.0.0.1 tightens it.
      - "${MONITOR_BIND_HOST:-0.0.0.0}:8090:8090"
    volumes:
      - monitordata:/var/lib/infinia-monitor
    restart: unless-stopped
    logging: *default-logging
    <<: *default-limits

volumes:
  pgdata:
  miniodata:
  storedata:
  monitordata:
